<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Planning</title>
<link rel="stylesheet" href="/static/site.css">
<script src="/static/calendar.js"></script>
<style>
  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  input[type=number] {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    width: 100%;
  }
  .range { display: flex; gap: 6px; align-items: center; }
  .checkbox { flex-direction: row; align-items: center; gap: 8px; align-self: end; padding-bottom: 8px; }
  form button {
    grid-column: 1 / -1;
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }
  .status { margin: 24px 0 8px; }
  .status.warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  td:not(:first-child) { white-space: nowrap; }
  /* Swap mode adds columns; on a narrow screen the table scrolls rather than the page. */
  #included { overflow-x: auto; }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  tfoot td { font-weight: 600; border-bottom: none; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; color: var(--muted); }
  .summary strong { color: var(--text); }
  .save-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; }
  .save-button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .save-button:disabled { opacity: 0.6; cursor: progress; }
  .save-status { color: var(--muted); font-size: 0.9rem; }
  .save-status.warn { color: var(--warn); }
  .excluded { color: var(--muted); font-size: 0.9rem; }
  details { margin-top: 32px; }
  summary { font-weight: 600; color: var(--muted); cursor: pointer; }
  summary h2 { display: inline; margin: 0; }
  details[open] summary { margin-bottom: 8px; }
  .update-button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 2px 10px;
    margin-left: 12px;
    cursor: pointer;
  }
  .update-button:disabled { opacity: 0.6; cursor: progress; }
  .update-status { margin-left: 8px; font-weight: normal; font-size: 0.85rem; }
  .choice-summary { margin-left: 8px; font-weight: normal; font-size: 0.85rem; }
  th.swap-cell, td.swap-cell { text-align: center; white-space: nowrap; }
  .swap-button, .swap-in-button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 8px;
    cursor: pointer;
  }
  .swap-button:hover, .swap-in-button:hover { border-color: var(--accent); }
  tr.swapping-out td { background: var(--surface); font-weight: 600; }
  tr.swapping-out .swap-button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  tr.swap-meets td { background: var(--meets-tint); }
  tr.swap-closest td { background: var(--closest-tint); }
  .current-outing { color: var(--muted); font-size: 0.85rem; }
  .swap-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
    margin-bottom: 8px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .swap-banner[hidden] { display: none; }
  .swap-banner.warn { color: var(--warn); }
  .swatch { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 3px; vertical-align: -0.1em; border: 1px solid var(--muted); }
  .swatch.meets { background: var(--meets-tint); }
  .swatch.closest { background: var(--closest-tint); }
</style>
</head>
<body>
<header class="tabs">
  <nav>
    <a href="/trail-planning" aria-current="page">Trail Planning</a>
    <a href="/training-log">Training Log</a>
    <a href="/fitness">Fitness</a>
  </nav>
</header>
<main>
  <h2 id="plan-heading">Plan</h2>

  <form id="plan-form">
    <label>Target vert (ft)
      <input type="number" id="target-vert-ft" value="6000" min="1" step="any" required>
    </label>
    <label>Target running (mi)
      <input type="number" id="target-running-mi" value="2" min="0" step="any" required>
    </label>
    <label>Outings
      <span class="range">
        <input type="number" id="min-outings" value="1" min="1" step="1" required>
        to
        <input type="number" id="max-outings" value="6" min="1" step="1" required>
      </span>
    </label>
    <label>Vert tolerance (%)
      <input type="number" id="vert-tolerance-pct" value="3" min="0" step="any" required>
    </label>
    <label class="checkbox">
      <input type="checkbox" id="allow-repeats"> Allow repeat trails
    </label>
    <button type="submit" id="plan-button">Generate</button>
  </form>

  <div id="result"></div>

  <details id="included-details">
    <summary>
      <h2>Included Trails</h2>
      <span class="choice-summary" id="choice-summary"></span>
      <button type="button" class="update-button" id="update-trails" title="Re-read the GPX files">⟳ Update</button>
      <span class="update-status" id="update-status"></span>
    </summary>
    <div class="swap-banner" id="swap-banner" hidden>
      <span id="swap-banner-text"></span>
      <button type="button" class="swap-in-button" id="cancel-swap">Cancel swap</button>
    </div>
    <div id="included">Loading…</div>
  </details>

  <section id="excluded-section" hidden>
    <h2>Excluded Trails (incomplete data)</h2>
    <p class="excluded" id="excluded"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtFt = (ft) => Math.round(ft).toLocaleString() + " ft";
const fmtMi = (mi) => mi.toFixed(2) + " mi";
const fmtPct = (frac) => (frac >= 0 ? "+" : "") + (frac * 100).toFixed(1) + "%";
const prettyName = (name) => name.replaceAll("_", " ");

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

// Each extra column is {header, className, cell: (trail, index) => <td>}, added after the stats;
// `index` is the trail's position in `trails`.
function trailsTable(trails, extraColumns = []) {
  const table = el("table");
  const head = table.createTHead().insertRow();
  for (const h of ["Trail", "Vert", "Distance", "Runnable"]) head.append(el("th", h));
  for (const column of extraColumns) head.append(el("th", column.header, column.className));
  const body = table.createTBody();
  trails.forEach((t, i) => {
    const row = body.insertRow();
    row.append(el("td", prettyName(t.name)), el("td", fmtFt(t.vert_ft)),
               el("td", fmtMi(t.distance_mi)), el("td", fmtMi(t.runnable_mi)),
               ...extraColumns.map((column) => column.cell(t, i)));
  });
  return table;
}

// What the user chose for each trail they've required or excluded, by trail name. Trails absent
// here are neither; kept across reloads of the catalog, which redraw the table.
const Choice = { require: "require", exclude: "exclude" };
const trailChoices = new Map();

function namesWithChoice(choice) {
  return [...trailChoices].filter(([, c]) => c === choice).map(([name]) => name);
}

function renderChoiceSummary() {
  const parts = [];
  const numRequired = namesWithChoice(Choice.require).length;
  const numExcluded = namesWithChoice(Choice.exclude).length;
  if (numRequired) parts.push(`${numRequired} required`);
  if (numExcluded) parts.push(`${numExcluded} excluded`);
  $("choice-summary").textContent = parts.join(" · ");
}

function showChoice(row, name) {
  for (const box of row.querySelectorAll("input.choice")) box.checked = trailChoices.get(name) === box.dataset.choice;
  row.classList.toggle("ruled-out", trailChoices.get(name) === Choice.exclude);
}

function choiceColumn(header, choice) {
  return {
    header,
    className: "choice-cell",
    cell(trail) {
      const box = el("input", undefined, `choice choice-${choice}`);
      box.type = "checkbox";
      box.dataset.choice = choice;
      box.setAttribute("aria-label", `${header} ${prettyName(trail.name)}`);
      box.addEventListener("change", () => {
        // Checking one box replaces the row's other choice; unchecking leaves the trail unconstrained.
        if (box.checked) trailChoices.set(trail.name, choice);
        else trailChoices.delete(trail.name);
        showChoice(box.closest("tr"), trail.name);
        renderChoiceSummary();
        rememberSettings();
        labelPlanButton();
      });
      const td = el("td", undefined, "choice-cell");
      td.append(box);
      return td;
    },
  };
}

function includedTable(trails) {
  const columns = [choiceColumn("Require", Choice.require), choiceColumn("Exclude", Choice.exclude)];
  if (swap) columns.push(...swapInColumns());
  const table = trailsTable(trails, columns);
  trails.forEach((t, i) => {
    const row = table.tBodies[0].rows[i];
    showChoice(row, t.name);
    const recommendation = swap?.options.get(t.name)?.recommendation;
    if (recommendation) row.classList.add(recommendationClass[recommendation]);
  });
  return table;
}

const swapOutColumn = {
  header: "",
  className: "swap-cell",
  cell(trail, outingIndex) {
    const button = el("button", "⇄", "swap-button");
    button.type = "button";
    button.title = `Swap out ${prettyName(trail.name)}`;
    button.setAttribute("aria-label", button.title);
    button.addEventListener("click", () => toggleSwap(outingIndex));
    const td = el("td", undefined, "swap-cell");
    td.append(button);
    return td;
  },
};

function planTable(plan) {
  const table = trailsTable(plan.trails, [swapOutColumn]);
  table.classList.add("plan-table");
  const foot = table.createTFoot().insertRow();
  foot.append(el("td", `Total (${plan.trails.length} outing${plan.trails.length === 1 ? "" : "s"})`),
              el("td", fmtFt(plan.total_vert_ft)), el("td", fmtMi(plan.total_distance_mi)),
              el("td", fmtMi(plan.total_runnable_mi)), el("td"));
  return table;
}

function planSummary(plan, targetRunningMi) {
  const summary = el("div", undefined, "summary");
  const item = (label, value) => {
    const span = el("span", label + " ");
    span.append(el("strong", value));
    return span;
  };
  summary.append(item("Vert vs target:", fmtPct(plan.vert_error_frac)),
                 item("Runnable available:", `${fmtMi(plan.total_runnable_mi)} for ${fmtMi(targetRunningMi)} target`));
  return summary;
}

// ---- The plan on display ----
// {plan, settings}: the plan on display and the settings it was shuffled with, which are saved along
// with it. Swapping an outing replaces `plan`. Null while no plan is shown.
let shownPlan = null;

// Show `plan` after the nodes in `lead`; `savable` adds the button that saves it for the week.
function showPlan(plan, settings, { lead = [], savable }) {
  shownPlan = { plan, settings };
  endSwap();
  $("result").replaceChildren(...lead, planTable(plan), planSummary(plan, settings.target_running_mi),
                              ...(savable ? [saveRow(plan, settings)] : []));
}

// Show `message` where the plan goes, when there's no plan to show.
function showNoPlan(message) {
  shownPlan = null;
  endSwap();
  $("result").replaceChildren(message);
}

// `settings` is the request body the result was shuffled with.
function renderResult(result, settings) {
  switch (result.status) {
    case "found":
      showPlan(result.plan, settings, { savable: true });
      break;
    case "no_plan_in_tolerance":
      showPlan(result.closest, settings, {
        lead: [el("p", "No plan lands within the vert tolerance. " +
                  `Recommended tolerance: ${(result.recommended_tolerance_frac * 100).toFixed(1)}% ` +
                  `(${result.num_plans_at_recommended} option${result.num_plans_at_recommended === 1 ? "" : "s"}). ` +
                  "Closest plan with enough runnable miles:", "status warn")],
        savable: true,
      });
      break;
    case "not_enough_runnable":
      showNoPlan(el("p", `Not enough runnable miles: the most any plan in this outing range offers is ${fmtMi(result.max_runnable_mi)}.`, "status warn"));
      break;
    case "no_combinations":
      showNoPlan(el("p", "Too few non-excluded trails with complete data to fill any outing count in this range.", "status warn"));
      break;
  }
}

// The settings on the page, as the request body for a shuffle.
function formSettings() {
  return {
    target_vert_ft: Number($("target-vert-ft").value),
    target_running_mi: Number($("target-running-mi").value),
    min_outings: Number($("min-outings").value),
    max_outings: Number($("max-outings").value),
    vert_tolerance_pct: Number($("vert-tolerance-pct").value),
    allow_repeats: $("allow-repeats").checked,
    required_trails: namesWithChoice(Choice.require),
    excluded_trails: namesWithChoice(Choice.exclude),
  };
}

// Put the page's settings back as `settings` describes them; the inverse of formSettings.
function applySettings(settings) {
  $("target-vert-ft").value = settings.target_vert_ft;
  $("target-running-mi").value = settings.target_running_mi;
  $("min-outings").value = settings.min_outings;
  $("max-outings").value = settings.max_outings;
  $("vert-tolerance-pct").value = settings.vert_tolerance_pct;
  $("allow-repeats").checked = settings.allow_repeats;
  trailChoices.clear();
  for (const name of settings.required_trails) trailChoices.set(name, Choice.require);
  for (const name of settings.excluded_trails) trailChoices.set(name, Choice.exclude);
}

// ---- Stepping through the acceptable plans ----
// The server shuffles every plan that meets the settings into an order, and each click shows the
// next one. {settingsKey, planIndex, numPlans}: the settings of the order last shuffled, where in it
// the last plan shown was, and how many plans it has. Null until a plan is found.
let shuffled = null;

// Settings as text that's equal whenever they ask for the same plans.
function settingsKey(settings) {
  return JSON.stringify({ ...settings,
                          required_trails: [...settings.required_trails].sort(),
                          excluded_trails: [...settings.excluded_trails].sort() });
}

// The order last shuffled, if it was for the settings on the page; otherwise null, and the next
// click shuffles a new one.
function shuffledForForm() {
  return shuffled?.settingsKey === settingsKey(formSettings()) ? shuffled : null;
}

function labelPlanButton() {
  const current = shuffledForForm();
  $("plan-button").textContent = current ? `Shuffle (${current.planIndex + 1}/${current.numPlans})` : "Generate";
}

$("plan-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const settings = formSettings();
  const current = shuffledForForm();
  // After the last plan in the order, start over at the first.
  const planIndex = current ? (current.planIndex + 1) % current.numPlans : null;
  const response = await fetch("/api/plan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...settings, plan_index: planIndex }),
  });
  const result = await response.json();
  if (!response.ok) {
    showNoPlan(el("p", result.error, "status warn"));
    return;
  }
  shuffled = result.status === "found"
    ? { settingsKey: settingsKey(settings), planIndex: result.plan_index, numPlans: result.num_plans }
    : null;
  labelPlanButton();
  renderResult(result, settings);
});

$("plan-form").addEventListener("input", labelPlanButton);

// ---- The week being planned ----
// The one whose first day is in the URL's ?week=YYYY-MM-DD, as the Training Log links to it;
// otherwise the current week, starting on the weekday chosen on the Training Log.
const week = (() => {
  const param = new URLSearchParams(window.location.search).get("week");
  const firstDay = param && /^\d{4}-\d{2}-\d{2}$/.test(param)
    ? dayOfIsoDate(param)
    : firstDayOfWeek(today, loadWeekStartWeekday());
  return { firstDay, lastDay: firstDay + 6 };
})();
const weekUrl = `/api/week-plans/${isoDateOfDay(week.firstDay)}`;
const weekRange = fmtDayRange(week.firstDay, week.lastDay);
const weekPhrase = week.firstDay <= today && today <= week.lastDay ? `this week (${weekRange})` : `the week of ${weekRange}`;

function saveRow(plan, settings) {
  const row = el("div", undefined, "save-row");
  const button = el("button", `Save plan for ${weekPhrase}`, "save-button");
  button.type = "button";
  const status = el("span", undefined, "save-status");
  button.addEventListener("click", () => savePlan(plan, settings, button, status));
  row.append(button, status);
  return row;
}

async function savePlan(plan, settings, button, status) {
  const put = (replaceExisting) => fetch(weekUrl, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ request: settings, trail_names: plan.trails.map((t) => t.name), replace_existing: replaceExisting }),
  });
  const showStatus = (text, isWarning) => {
    status.textContent = text;
    status.className = "save-status" + (isWarning ? " warn" : "");
  };
  button.disabled = true;
  try {
    let response = await put(false);
    if (response.status === 409) {
      if (!confirm(`A plan is already saved for ${weekPhrase}. Overwrite it?`)) return;
      response = await put(true);
    }
    if (!response.ok) {
      showStatus((await response.json()).error, true);
      return;
    }
    button.remove();
    showStatus(`Saved for ${weekPhrase}.`, false);
  } catch (e) {
    showStatus("Couldn't reach the server.", true);
  } finally {
    button.disabled = false;
  }
}

// ---- Settings remembered across tabs ----
// What you've set for the week, kept for this browser tab so it survives going to the Training Log
// and back. Kept per week, so opening another week's saved plan doesn't bring this week's settings.
const settingsStorageKey = `trailPlanningSettings:${isoDateOfDay(week.firstDay)}`;

function rememberSettings() {
  try {
    sessionStorage.setItem(settingsStorageKey, JSON.stringify(formSettings()));
  } catch {
    // Storage unavailable: the settings still hold until you leave the page.
  }
}

// What rememberSettings last kept for the week, or null if nothing was.
function rememberedSettings() {
  try {
    const stored = sessionStorage.getItem(settingsStorageKey);
    return stored === null ? null : JSON.parse(stored);
  } catch {
    return null;
  }
}

$("plan-form").addEventListener("input", rememberSettings);

// ---- Swapping an outing ----
// While a trail is being chosen to swap into the shown plan: the index of the outing being swapped
// out, and the server's option for each trail that could replace it, by trail name. Null otherwise.
let swap = null;

const recommendationClass = { meets_criteria: "swap-meets", closest: "swap-closest" };

// The Included Trails columns for choosing a swap: the plan's vert vs target after each one, and
// the button that makes it.
function swapInColumns() {
  const swappedOutName = shownPlan.plan.trails[swap.outingIndex].name;
  return [
    {
      header: "Vert vs target",
      className: "swap-cell",
      cell(trail) {
        const option = swap.options.get(trail.name);
        return el("td", option ? fmtPct(option.plan.vert_error_frac) : "", "swap-cell");
      },
    },
    {
      header: "",
      className: "swap-cell",
      cell(trail) {
        const td = el("td", undefined, "swap-cell");
        const option = swap.options.get(trail.name);
        if (option) {
          const button = el("button", "Swap in", "swap-in-button");
          button.type = "button";
          button.addEventListener("click", () => chooseSwap(option));
          td.append(button);
        } else if (trail.name === swappedOutName) {
          td.append(el("span", "Current", "current-outing"));
        }
        return td;
      },
    },
  ];
}

function showSwapBanner(content, isWarning) {
  $("swap-banner-text").replaceChildren(...content);
  $("swap-banner").className = "swap-banner" + (isWarning ? " warn" : "");
  $("swap-banner").hidden = false;
}

function markSwappingOut() {
  const table = $("result").querySelector("table.plan-table");
  if (!table) return;
  [...table.tBodies[0].rows].forEach((row, i) => row.classList.toggle("swapping-out", i === swap?.outingIndex));
}

// Show Included Trails, drawn for the current swap, and scroll to it.
function revealIncluded() {
  const details = $("included-details");
  // Opening it reloads the catalog, which draws the table.
  if (details.open) drawIncluded();
  else details.open = true;
  details.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Start choosing a trail to swap in for the shown plan's outing at `outingIndex`, or stop if that
// outing is the one already being swapped.
async function toggleSwap(outingIndex) {
  if (swap?.outingIndex === outingIndex) {
    endSwap();
    return;
  }
  const requestedFor = shownPlan;
  const showProblem = (text) => {
    endSwap();
    showSwapBanner([text], true);
    revealIncluded();
  };
  let response, result;
  try {
    response = await fetch("/api/plan/swap-options", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request: requestedFor.settings, trails: requestedFor.plan.trails, outing_index: outingIndex }),
    });
    result = await response.json();
  } catch {
    if (shownPlan === requestedFor) showProblem("Couldn't reach the server.");
    return;
  }
  if (shownPlan !== requestedFor) return;  // Another plan was shown while the options loaded.
  if (!response.ok) {
    showProblem(result.error);
    return;
  }
  swap = { outingIndex, options: new Map(result.options.map((option) => [option.trail.name, option])) };
  markSwappingOut();
  const swatch = (kind) => el("span", undefined, `swatch ${kind}`);
  showSwapBanner([`Swapping out outing ${outingIndex + 1}, `, el("strong", prettyName(shownPlan.plan.trails[outingIndex].name)),
                  ". ", swatch("meets"), " still meets your targets  ", swatch("closest"), " next closest"], false);
  revealIncluded();
}

function endSwap() {
  $("swap-banner").hidden = true;
  if (swap === null) return;
  swap = null;
  markSwappingOut();
  drawIncluded();
}

function chooseSwap(option) {
  // No lead: whatever was said above the plan, that it's the saved one or the closest, no longer holds.
  showPlan(option.plan, shownPlan.settings, { savable: true });
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("cancel-swap").addEventListener("click", endSwap);

// ---- Restoring the page ----

// The week's saved plan, or null if it has none or it couldn't be loaded.
async function loadSavedPlan() {
  const response = await fetch(weekUrl);
  if (response.status === 404) return null;
  if (!response.ok) {
    showNoPlan(el("p", `Couldn't load the plan saved for ${weekPhrase}.`, "status warn"));
    return null;
  }
  return response.json();
}

// Show the week's saved plan, if it has one, and put the settings back: the ones you last set for
// the week, else the ones its saved plan was shuffled with, else the defaults.
async function restorePage() {
  const saved = await loadSavedPlan();
  if (saved) showPlan(saved.plan, saved.request, { lead: [el("p", `Saved plan for ${weekPhrase}:`, "status")], savable: false });
  const settings = rememberedSettings() ?? saved?.request;
  if (settings) applySettings(settings);
  labelPlanButton();
}

// The plannable trails, as last loaded; null until they are.
let catalogTrails = null;

function drawIncluded() {
  if (catalogTrails === null) return;
  $("included").replaceChildren(catalogTrails.length ? includedTable(catalogTrails) : el("p", "None", "excluded"));
}

async function loadCatalog() {
  const catalog = await (await fetch("/api/trails")).json();
  // Forget choices for trails that are no longer plannable, so they aren't sent with the next shuffle.
  const plannableNames = new Set(catalog.complete.map((t) => t.name));
  for (const name of trailChoices.keys()) if (!plannableNames.has(name)) trailChoices.delete(name);
  renderChoiceSummary();
  labelPlanButton();
  catalogTrails = catalog.complete;
  drawIncluded();
  $("excluded-section").hidden = !catalog.incomplete_names.length;
  $("excluded").textContent = catalog.incomplete_names.map(prettyName).join(", ");
}

function counted(count, singular, plural) {
  return `${count} ${count === 1 ? singular : plural}`;
}

function updateSummary(report) {
  const text = `Updated ${counted(report.updated.length, "trail", "trails")}.`;
  return report.added.length
    ? `${text} Added ${report.added.map(prettyName).join(", ")}.`
    : text;
}

async function updateTrails() {
  $("update-trails").disabled = true;
  $("update-status").textContent = "Updating…";
  try {
    const response = await fetch("/api/trails/update", { method: "POST" });
    const result = await response.json();
    $("update-status").textContent = response.ok ? updateSummary(result) : result.error;
    if (response.ok) await loadCatalog();
  } catch (e) {
    $("update-status").textContent = "Couldn't reach the server.";
  } finally {
    $("update-trails").disabled = false;
  }
}

$("update-trails").addEventListener("click", (event) => {
  // The button sits in the <summary>; don't let the click also expand or collapse the list.
  event.preventDefault();
  updateTrails();
});

$("plan-heading").textContent = `Plan for ${weekPhrase}`;
// Settings first, so their trail choices are in place when the catalog's table is drawn.
restorePage().finally(loadCatalog);
// Reload when expanded, so trails processed since the page loaded show up. Collapsing it stops a swap.
$("included-details").addEventListener("toggle", (event) => {
  if (event.target.open) loadCatalog();
  else endSwap();
});
</script>
</body>
</html>
