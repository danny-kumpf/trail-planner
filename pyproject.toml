[project]
name = "trail-planner"
version = "0.1.0"
description = "Weekly trail training planner: pick trails that hit a vert target"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "garmin-fit-sdk>=21.217.0",
    "gpxpy>=1.6",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
